name: Export Keystore Set
on: [workflow_dispatch]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Decode KEYSTORE_SET
        env:
          KS_SET: ${{ secrets.KEYSTORE_SET }}
        run: echo "$KS_SET" | tr -d '\n\r ' | base64 -d > keystore_set.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aaps-keystore-set
          path: keystore_set.json
