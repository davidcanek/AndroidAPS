name: Download Keystore Artifact
on: [workflow_dispatch]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_SET }}
        run: echo "$KEYSTORE_B64" | base64 -d > keystore.jks
      - name: Upload keystore as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-aaps-keystore
          path: keystore.jks
