name: Inspect GDrive Secret
on: [workflow_dispatch]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Decode GDRIVE_OAUTH2
        env:
          GD_SECRET: ${{ secrets.GDRIVE_OAUTH2 }}
        run: echo "$GD_SECRET" | tr -d '\n\r ' | base64 -d > gdrive_info.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdrive-info
          path: gdrive_info.txt
